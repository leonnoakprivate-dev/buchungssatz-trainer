<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Buchungssatz-Trainer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Buchungssatz">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F5F7FC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#040507" media="(prefers-color-scheme: dark)">
<style>:root { padding-top: env(safe-area-inset-top, 0px); } html, body { overscroll-behavior-y: none; }</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Farben: hell (Standard) ---------- */
:root {
  --bg: #F5F7FC; --bg-rgb: 245 247 252;
  --ink: #0B1020; --muted: #555D6E;
  --surface: #FFFFFF; --line: rgba(11,16,32,0.07);
  --glass: rgba(255,255,255,0.72); --glass-line: rgba(11,16,32,0.06);
  --rund-bg: rgba(255,255,255,0.55); --rund-line: rgba(255,255,255,0.85);
  --chip-bg: rgba(255,255,255,0.7); --chip-ink: #3A4152;
  --accent: #1F63FF; --akzent-text: #1F5BFF; --accent-soft: rgba(31,99,255,0.10); --accent-ink: #FFFFFF;
  --track: #C9CFDB;
  --ok: #0F7A47; --ok-bg: rgba(15,122,71,0.09); --ok-line: rgba(15,122,71,0.35);
  --bad: #C62F2B; --bad-bg: rgba(198,47,43,0.08); --bad-line: rgba(198,47,43,0.35);
  --input-bg: #FFFFFF; --sheet-bg: #FFFFFF; --toast-bg: #0B1020; --toast-ink: #FFFFFF;
  --s-kern: 255 255 255; --s-mitte: 127 166 255; --s-hell: 185 206 255; --s-links: 157 187 255; --s-tief: 47 95 232; --s-tief-a: 0.5;
  --korn-op: 0.11; --korn-blend: multiply;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
/* ---------- Farben: dunkel ---------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #040507; --bg-rgb: 4 5 7;
    --ink: #F2F4F8; --muted: #9BA3B4;
    --surface: rgba(255,255,255,0.05); --line: rgba(255,255,255,0.08);
    --glass: rgba(20,22,28,0.72); --glass-line: rgba(255,255,255,0.08);
    --rund-bg: rgba(255,255,255,0.12); --rund-line: rgba(255,255,255,0.22);
    --chip-bg: rgba(255,255,255,0.08); --chip-ink: #D5DBE8;
    --akzent-text: #4D86FF; --accent-soft: rgba(47,107,255,0.16);
    --track: #3A3F4A;
    --ok: #4FD18B; --ok-bg: rgba(79,209,139,0.10); --ok-line: rgba(79,209,139,0.4);
    --bad: #FF7A74; --bad-bg: rgba(255,122,116,0.10); --bad-line: rgba(255,122,116,0.4);
    --input-bg: rgba(255,255,255,0.05); --sheet-bg: #101218; --toast-bg: #F2F4F8; --toast-ink: #040507;
    --s-kern: 228 236 255; --s-mitte: 31 91 255; --s-hell: 127 166 255; --s-links: 42 85 216; --s-tief: 14 40 140; --s-tief-a: 0.9;
    --korn-op: 0.2; --korn-blend: overlay;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #040507; --bg-rgb: 4 5 7;
  --ink: #F2F4F8; --muted: #9BA3B4;
  --surface: rgba(255,255,255,0.05); --line: rgba(255,255,255,0.08);
  --glass: rgba(20,22,28,0.72); --glass-line: rgba(255,255,255,0.08);
  --rund-bg: rgba(255,255,255,0.12); --rund-line: rgba(255,255,255,0.22);
  --chip-bg: rgba(255,255,255,0.08); --chip-ink: #D5DBE8;
  --akzent-text: #4D86FF; --accent-soft: rgba(47,107,255,0.16);
  --track: #3A3F4A;
  --ok: #4FD18B; --ok-bg: rgba(79,209,139,0.10); --ok-line: rgba(79,209,139,0.4);
  --bad: #FF7A74; --bad-bg: rgba(255,122,116,0.10); --bad-line: rgba(255,122,116,0.4);
  --input-bg: rgba(255,255,255,0.05); --sheet-bg: #101218; --toast-bg: #F2F4F8; --toast-ink: #040507;
  --s-kern: 228 236 255; --s-mitte: 31 91 255; --s-hell: 127 166 255; --s-links: 42 85 216; --s-tief: 14 40 140; --s-tief-a: 0.9;
  --korn-op: 0.2; --korn-blend: overlay;
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--ink); background: var(--bg); min-height: 100vh; position: relative; font-variant-numeric: tabular-nums; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.03em; font-weight: 600; }
p { margin: 0; }

/* ---------- Hintergrund: Blau-Schein + Korn (hängt oben an der Seite, scrollt mit) ---------- */
#schein { position: absolute; top: 0; left: 0; right: 0; bottom: 0; min-height: 100svh; background: var(--bg); z-index: 0; pointer-events: none; overflow: hidden; }
.schein-farbe {
  position: absolute; left: -25%; right: -25%; top: -14vh; height: 78vh; filter: blur(36px);
  background:
    radial-gradient(34% 26% at 62% 30%, rgb(var(--s-kern) / 1) 0%, rgb(var(--s-kern) / 0) 72%),
    radial-gradient(42% 34% at 40% 46%, rgb(var(--s-mitte) / 1) 0%, rgb(var(--s-mitte) / 0) 74%),
    radial-gradient(52% 40% at 72% 18%, rgb(var(--s-hell) / 1) 0%, rgb(var(--s-hell) / 0) 72%),
    radial-gradient(60% 46% at 22% 20%, rgb(var(--s-links) / 1) 0%, rgb(var(--s-links) / 0) 72%),
    radial-gradient(70% 50% at 50% 70%, rgb(var(--s-tief) / var(--s-tief-a)) 0%, rgb(var(--s-tief) / 0) 72%);
  transition: opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1);
  will-change: transform, opacity;
}
.schein-fade { position: absolute; top: 0; left: 0; right: 0; height: 100svh; background: linear-gradient(180deg, rgb(var(--bg-rgb) / 0) 0%, rgb(var(--bg-rgb) / 0) 30%, rgb(var(--bg-rgb) / 0.8) 55%, rgb(var(--bg-rgb) / 1) 70%); transition: opacity .6s ease; }
.schein-fade-leise { position: absolute; top: 0; left: 0; right: 0; height: 100svh; opacity: 0; background: linear-gradient(180deg, rgb(var(--bg-rgb) / 0) 0%, rgb(var(--bg-rgb) / 0.6) 20%, rgb(var(--bg-rgb) / 1) 34%); transition: opacity .6s ease; }
body[data-schein="leise"] .schein-farbe { opacity: 0.7; transform: translateY(-18vh) scale(0.92); }
body[data-schein="leise"] .schein-fade { opacity: 0; }
body[data-schein="leise"] .schein-fade-leise { opacity: 1; }
.korn { position: absolute; inset: 0; width: 100%; height: 100%; opacity: var(--korn-op); mix-blend-mode: var(--korn-blend); }

/* ---------- Grundlayout ---------- */
.wrap {
  position: relative; z-index: 1; max-width: 540px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(126px + env(safe-area-inset-bottom, 0px));
}
#app { display: flex; flex-direction: column; gap: 12px; }
.muted { color: var(--muted); }
.klein { font-size: 13.5px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.zeile { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.akzent { color: var(--akzent-text); }
.titel { font-size: 32px; line-height: 1.12; margin-top: 18px; }
.unter { margin-top: -2px; color: var(--muted); }

/* Kopf, runde Glas-Buttons, Pillen */
.kopf { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 4px; }
.s-kopf { display: flex; align-items: center; gap: 14px; padding-top: 4px; }
.s-kopf .zaehler { font-size: 13px; font-weight: 600; color: var(--chip-ink); min-width: 36px; text-align: right; }
.s-kopf .mitte { flex: 1; min-width: 0; display: flex; align-items: center; }
.platz { width: 40px; flex: none; }
.rund { width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--rund-line); background: var(--rund-bg); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); display: grid; place-items: center; flex: none; padding: 0; color: var(--ink); font-weight: 700; font-size: 15px; }
.rund svg { width: 19px; height: 19px; }
.pill-tag { align-self: flex-start; font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 999px; background: var(--chip-bg); border: 1px solid var(--line); color: var(--chip-ink); }

/* Fortschritt: Punkte und Balken */
.dots { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.dots i { width: 6px; height: 6px; border-radius: 6px; background: var(--track); transition: width .35s cubic-bezier(.2,.8,.2,1), background-color .3s; }
.dots i.done { background: var(--accent); }
.dots i.jetzt { width: 36px; background: var(--accent); }
.bar { flex: 1; height: 5px; border-radius: 5px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 5px; background: var(--accent); transition: width .5s cubic-bezier(.2,.8,.2,1); }

/* Home */
.held { display: flex; flex-direction: column; min-height: calc(100svh - 150px - env(safe-area-inset-bottom, 0px)); }
.held .gruss { font-size: 34px; line-height: 1.1; margin-top: 26px; }
.held .luft { flex: 1; min-height: 32px; }
.held h2 { font-size: 32px; line-height: 1.12; margin-top: 14px; }
.held .meta { margin-top: 10px; color: var(--muted); font-size: 15px; }
.held .dots { margin-top: 16px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 22px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.stat span { font-size: 12px; color: var(--muted); font-weight: 500; }
.held .btn { margin-top: 18px; }

/* Karten */
.karte { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px; text-align: left; width: 100%; min-width: 0; color: var(--ink); }
button.karte { font: inherit; }
.tap { transition: transform .12s ease; }
.tap:active { transform: scale(.985); }
.karte h2 { font-size: 22px; line-height: 1.2; }
.karte h3 { font-size: 18px; line-height: 1.3; }
.hinweis { background: transparent; }
.gesperrt .zeile svg { color: var(--muted); flex: none; }

/* Buttons */
.btn {
  border: 0; border-radius: 999px; padding: 0 24px; height: 56px; font-weight: 600; font-size: 16px; color: #FFFFFF;
  background: radial-gradient(60% 120% at 50% 100%, rgba(141,184,255,0.95) 0%, rgba(141,184,255,0) 60%), var(--accent);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:disabled { opacity: .35; }
.btn-zwei { border: 1px solid var(--line); border-radius: 999px; padding: 0 20px; height: 50px; font-weight: 600; font-size: 15px; background: var(--surface); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; }
.btn-zwei.rot { background: var(--bad-bg); color: var(--bad); border-color: var(--bad-line); }
.btn-text { border: 0; background: transparent; height: 46px; color: var(--chip-ink); font-weight: 500; font-size: 15px; }
.breit { width: 100%; }
.link { background: none; border: 0; padding: 8px 0; color: var(--akzent-text); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; }
.aktionen .link { align-self: center; }
.link svg { width: 16px; height: 16px; }
.aktionen { display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
.aktionen.reihe { flex-direction: row; justify-content: flex-start; align-items: center; gap: 16px; }

/* Listen */
.liste { display: flex; flex-direction: column; gap: 8px; }
.le, .schritt, .modus { flex-direction: row; align-items: center; gap: 14px; padding: 14px 16px; }
.le .nr, .schritt .nr { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--akzent-text); font-weight: 700; flex: none; }
.schritt .nr.fertig { background: var(--accent); color: #FFFFFF; }
.schritt .nr svg { width: 18px; height: 18px; }
.le-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.le-text b { font-weight: 600; }
.schritt > span:nth-child(2), .modus > span:nth-child(2) { flex: 1; min-width: 0; }
.schritt > svg, .modus > svg, .zeile > svg { color: var(--muted); flex: none; }
.le.aus { opacity: .5; }
.le.aus svg { color: var(--muted); flex: none; }
.balken { height: 4px; background: var(--track); border-radius: 4px; overflow: hidden; }
.balken i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.m-icon { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); color: var(--akzent-text); display: grid; place-items: center; flex: none; }
button.karte:disabled { opacity: .45; }
.punkte { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.punkte.haken { list-style: "✓  "; }
.meldungen { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }

/* Chips & Segmente */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 14.5px; min-height: 40px; color: var(--ink); }
.chip.an { background: var(--accent); color: #FFFFFF; border-color: var(--accent); }
.chip.an .kn { color: inherit; opacity: .8; }
.chip.aus { opacity: .4; }
.chip.an.ok { background: var(--ok); border-color: var(--ok); color: #FFFFFF; }
.chip.an.bad { background: var(--bad); border-color: var(--bad); color: #FFFFFF; }
.seg { display: flex; background: var(--input-bg); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; flex-wrap: wrap; }
.seg button { flex: 1 1 auto; border: 0; background: none; border-radius: 9px; padding: 8px 10px; font-size: 14px; font-weight: 500; min-height: 38px; color: var(--muted); }
.seg button.an { background: var(--accent); color: #FFFFFF; font-weight: 600; }
.seg button.an.ok { background: var(--ok); color: #FFFFFF; }
.seg button.an.bad { background: var(--bad); color: #FFFFFF; }

/* Lektion */
.lektion { display: flex; flex-direction: column; gap: 14px; }
.lektion h1 { font-size: 32px; line-height: 1.12; }
.lektion p, .lektion li { font-size: 16.5px; line-height: 1.6; max-width: 62ch; }
.merke { background: var(--accent-soft); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; font-size: 15.5px; }
.merke .label { color: var(--akzent-text); }
.frage-text { font-size: 17px; font-weight: 600; line-height: 1.35; }
.gross-text { font-size: 20px; }
.optionen { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px 16px; font-size: 15.5px; min-height: 52px; color: var(--ink); }
.opt.ok { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.opt.bad { border-color: var(--bad-line); background: var(--bad-bg); color: var(--bad); }
.opt:disabled:not(.ok):not(.bad) { opacity: .5; }
.fb { border-radius: 14px; padding: 12px 14px; font-size: 15px; }
.fb.ok { background: var(--ok-bg); color: var(--ok); }
.fb.bad { background: var(--bad-bg); color: var(--bad); }
.fb.neutral { background: var(--accent-soft); }
.fall-text { font-size: 24px; line-height: 1.28; letter-spacing: -0.02em; font-weight: 600; margin-top: 14px; }

/* Buchungssatz */
.satz { background: var(--input-bg); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.satz-datum { font-size: 12.5px; color: var(--muted); }
.sz { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: baseline; }
.sk { min-width: 0; hyphens: auto; }
.sk .kn { display: block; }
.nt { font-variant-numeric: normal; }
.sz .sb { min-width: 64px; white-space: nowrap; text-align: right; font-weight: 600; }
.anw { color: var(--muted); font-style: italic; margin-right: 8px; }
.sz .anw { margin-left: 14px; }
.kn { color: var(--muted); font-size: 13px; font-weight: 400; }

/* Tabellen */
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
caption { text-align: left; font-weight: 600; padding-bottom: 6px; font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 8px; border-bottom: 1.5px solid var(--ink); }
td { padding: 6px 8px; }
.bilanz { font-size: 13px; }
.bilanz td, .bilanz th { padding: 4px 5px; }
.bilanz td:not(.num) { hyphens: auto; overflow-wrap: anywhere; }
.bilanz td.num, .bilanz tfoot td { text-align: right; white-space: nowrap; }
.bilanz tfoot td.num { border-top: 1px solid var(--ink); border-bottom: 3px double var(--ink); font-weight: 600; }
.trenn { border-left: 1.5px solid var(--ink); }
.fragen td { border-bottom: 1px solid var(--line); white-space: nowrap; }

/* T-Konto */
.tk-reihe { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.tkonto { font-size: 14px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.t-kopf { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1.5px solid var(--ink); padding: 0 2px 4px; gap: 8px; }
.t-kopf b { text-align: center; flex: 1; font-size: 14px; font-weight: 600; }
.t-kopf span { color: var(--muted); font-size: 12px; }
.t-body { display: grid; grid-template-columns: 1fr 1fr; }
.t-body > div { padding: 4px 6px; display: flex; flex-direction: column; gap: 2px; }
.t-body > div:first-child { border-right: 1.5px solid var(--ink); }
.tz { display: flex; justify-content: space-between; gap: 6px; }
.tz span:first-child { color: var(--muted); }
.t-sum { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--ink); }
.t-sum span { justify-self: end; margin: 2px 6px 0; font-weight: 600; border-bottom: 3px double var(--ink); }

/* Geführt */
.analyse { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.an-kopf { font-size: 16px; }
.seg-zeile { display: flex; flex-direction: column; gap: 4px; }

/* Eingabe */
.seite-label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-top: 4px; }
.ez { display: flex; align-items: center; gap: 8px; }
.ez .anw { margin: 0; width: 20px; flex: none; }
.konto-btn { flex: 1; min-width: 0; text-align: left; border: 1px solid var(--line); background: var(--input-bg); border-radius: 14px; padding: 10px 12px; min-height: 50px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.konto-btn.leer { color: var(--muted); border-style: dashed; }
.betrag { width: 112px; flex: none; text-align: right; border: 1px solid var(--line); background: var(--input-bg); border-radius: 14px; padding: 10px 12px; min-height: 50px; color: var(--ink); }
.x { width: 36px; height: 36px; flex: none; border: 0; background: none; color: var(--muted); display: grid; place-items: center; border-radius: 50%; }
.x svg { width: 18px; height: 18px; }
.eingabe { width: 100%; border: 1px solid var(--line); background: var(--input-bg); border-radius: 14px; padding: 11px 14px; min-height: 48px; color: var(--ink); }
textarea.eingabe { resize: vertical; min-height: 120px; }
.form { gap: 16px; }
.feld { display: flex; flex-direction: column; gap: 6px; }
.feld > span { font-size: 14px; font-weight: 600; }
.glossar { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.glossar p { color: var(--muted); }
.glossar b { color: var(--ink); }

/* Ende */

.ende .stats { margin-top: 22px; }
.ende .aktionen { margin-top: 22px; }

/* Navigation */
#nav {
  position: fixed; z-index: 20;
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  bottom: max(26px, calc(env(safe-area-inset-bottom, 0px) + 10px));
  max-width: 540px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; border-radius: 999px;
  background: var(--glass); border: 1px solid var(--glass-line);
  -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6);
}
#nav .pille {
  position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 4); border-radius: 999px;
  background: var(--accent); transform: translateX(calc(var(--i, 0) * 100%));
  transition: transform .42s cubic-bezier(.3, 1.3, .5, 1);
}
#nav button {
  position: relative; border: 0; background: none; color: var(--muted); border-radius: 999px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  padding: 6px 0 5px; min-height: 52px; font-size: 10px; font-weight: 500; letter-spacing: .01em; line-height: 1.1;
  transition: color .2s ease;
}
#nav button svg { width: 24px; height: 24px; transition: transform .25s cubic-bezier(.3, 1.4, .5, 1); }
#nav button.an { color: #FFFFFF; font-weight: 600; }
#nav button:active svg { transform: scale(.88); }

/* Sheet */
#sheet { position: fixed; inset: 0; z-index: 40; }
.sheet-bg { position: absolute; inset: 0; background: rgba(0, 0, 0, .5); animation: dunkel .25s ease both; }
.sheet-box {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 86vh; overflow: auto; background: var(--sheet-bg); color: var(--ink);
  border-radius: 24px 24px 0 0; animation: hoch .38s cubic-bezier(.2, .9, .25, 1) both; display: flex; flex-direction: column; gap: 12px; margin: 0 auto; max-width: 540px;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));

.kliste { display: flex; flex-direction: column; }
.kliste .label { padding: 12px 0 4px; }
.kitem { display: flex; gap: 12px; align-items: baseline; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 12px 2px; min-height: 48px; color: var(--ink); }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(100px, calc(env(safe-area-inset-bottom, 0px) + 84px)); z-index: 50; background: var(--toast-bg); color: var(--toast-ink); padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; max-width: calc(100% - 32px); text-align: center; animation: toast .25s ease both; }

/* Animationen */
@keyframes rein { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes rein-tab { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.025); } 100% { transform: scale(1); } }
@keyframes wackel { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
@keyframes einblenden { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes hoch { from { transform: translateY(100%); } to { transform: none; } }
@keyframes toast { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes dunkel { from { opacity: 0; } to { opacity: 1; } }
@keyframes haken { 0% { transform: scale(.4); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
.rein > * { animation: rein .5s cubic-bezier(.2, .8, .2, 1) both; }
.rein-tab > * { animation: rein-tab .38s cubic-bezier(.2, .8, .2, 1) both; }
.rein > :nth-child(2), .rein-tab > :nth-child(2) { animation-delay: .04s; }
.rein > :nth-child(3), .rein-tab > :nth-child(3) { animation-delay: .08s; }
.rein > :nth-child(4), .rein-tab > :nth-child(4) { animation-delay: .12s; }
.rein > :nth-child(5), .rein-tab > :nth-child(5) { animation-delay: .16s; }
.rein > :nth-child(n+6), .rein-tab > :nth-child(n+6) { animation-delay: .2s; }
.opt.ok.neu, .chip.an.ok { animation: pop .35s ease; }
.opt.bad.neu { animation: wackel .4s ease; }
.fb, .merke + .klein { animation: einblenden .3s ease both; }
.ende-icon { animation: haken .5s cubic-bezier(.3, 1.4, .5, 1) .1s both; }
.btn, .btn-zwei, .opt, .chip, .seg button, .konto-btn, .kitem, .rund { transition: transform .15s ease, background-color .2s ease, color .2s ease, border-color .2s ease; }

    clearTimeout(toast.t); toast.t = setTimeout(() => { toastEl.hidden = true; }, 2200);
  }

  /* ---------- Bausteine ---------- */
  function satzHtml(soll, haben, datum) {
    const zeile = (k, b, h) => `<div class="sz"><span class="sk">${h ? '<span class="anw">an</span>' : ""}${kontoHtml(k)}</span><span class="sb">${h ? "" : eur(b)}</span><span class="sb">${h ? eur(b) : ""}</span></div>`;
    return `<div class="satz">${datum ? `<div class="satz-datum">${esc(datum)}</div>` : ""}${soll.map(([k, b]) => zeile(k, b, false)).join("")}${haben.map(([k, b]) => zeile(k, b, true)).join("")}</div>`;
  }
  const satzVonFall = f => satzHtml(f.soll.map(z => [z.konto, z.betrag]), f.haben.map(z => [z.konto, z.betrag]), f.datum);
  function bilanzHtml(b) {
    const sum = a => a.reduce((s, x) => s + x[1], 0);
    const n = Math.max(b.aktiva.length, b.passiva.length);
    let rows = "";
    for (let i = 0; i < n; i++) {
      const a = b.aktiva[i], p = b.passiva[i];
      rows += `<tr><td>${a ? esc(a[0]) : ""}</td><td class="num">${a ? eur(a[1]) : ""}</td><td class="trenn">${p ? esc(p[0]) : ""}</td><td class="num">${p ? eur(p[1]) : ""}</td></tr>`;
    }
    return `<div class="scroll"><table class="bilanz"><caption>${esc(b.titel || "Bilanz")}</caption><thead><tr><th colspan="2">Aktiva</th><th colspan="2" class="trenn">Passiva</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td></td><td class="num">${eur(sum(b.aktiva))}</td><td class="trenn"></td><td class="num">${eur(sum(b.passiva))}</td></tr></tfoot></table></div>`;
  }
  function tkontoHtml(t) {
    const seite = arr => arr.map(([g, b]) => `<div class="tz"><span>${esc(g)}</span><span class="num">${eur(b)}</span></div>`).join("") || `<div class="tz leer">&nbsp;</div>`;
    const summe = t.summe ? `<div class="t-sum"><span class="num">${eur(t.summe)}</span><span class="num">${eur(t.summe)}</span></div>` : "";
    return `<div class="tkonto"><div class="t-kopf"><span>S</span><b>${esc(t.name)}</b><span>H</span></div><div class="t-body"><div>${seite(t.soll)}</div><div>${seite(t.haben)}</div></div>${summe}</div>`;
  }
  function fragenHtml(rows) {
    return `<div class="scroll"><table class="fragen"><thead><tr><th>Konto</th><th>Kontoart</th><th>+ / –</th><th>Seite</th></tr></thead><tbody>${rows.map(([k, a, r, s]) =>
      `<tr><td><b>${esc(k)}</b></td><td>${esc(ARTKURZ[a] || a)}</td><td>${esc(r || "·")}</td><td>${s === "S" ? "Soll" : "Haben"}</td></tr>`).join("")}</tbody></table></div>`;
  }
  const GLOSSAR = {
    EBK: "Eröffnungsbilanzkonto: Hilfskonto für den 1.1. Es nimmt die Gegenbuchung jedes Anfangsbestands auf und ist das Spiegelbild der Bilanz. Aktive Konten: Konto an EBK. Passive Konten: EBK an Konto.",
    SBK: "Schlussbilanzkonto: Hilfskonto für den 31.12. Es sammelt die Schlussbestände aller Bestandskonten und ist inhaltlich die Schlussbilanz. Aktive Konten: SBK an Konto. Passive Konten: Konto an SBK.",
    "G&V": "Gewinn- und Verlustkonto: Hilfskonto für den 31.12. Es sammelt alle Aufwände (Soll) und Erträge (Haben). Der Saldo ist der Gewinn oder Verlust und geht ins Eigenkapital.",
    PRIV: "Konto Privat: Sonderkonto für alles, was zwischen Unternehmer und Unternehmen fliesst. Entnahme im Soll, Einlage im Haben. Am 31.12. mit dem Eigenkapital abgeschlossen.",
    EV: "Eigenverbrauch: Ertragskonto für Waren, die der Unternehmer privat entnimmt, bewertet zum Einstandspreis.",
    WES: "Wareneinsatz: Aufwandskonto. Hier landen alle Wareneinkäufe des Jahres.",
    WV: "Warenvorräte: aktives Bestandskonto, das während des Jahres ruht. Am 31.12. wird es mit dem Unterschiedsbetrag an die Inventur angepasst.",
    VST: "Vorsteuer: Steuer, die wir beim Einkauf zahlen und vom Finanzamt zurückbekommen. Aktives Bestandskonto.",
    UST: "Umsatzsteuer: Steuer, die wir beim Verkauf kassieren und dem Finanzamt schulden. Passives Bestandskonto.",
    USTZ: "USt-Zahllast: Umsatzsteuer minus Vorsteuer, also was wir dem Finanzamt wirklich zahlen. Passives Bestandskonto."
  };
  function glossarHtml(f) {
    const ks = kontenVon(f).filter(k => GLOSSAR[k]);
    return ks.length ? `<div class="glossar"><div class="label">Begriffe</div>${ks.map(k => `<p><b>${esc(k)}</b> · ${esc(GLOSSAR[k])}</p>`).join("")}</div>` : "";
  }
  function tabelleHtml(t) {
    return `<div class="scroll"><table class="fragen"><thead><tr>${t.kopf.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${t.zeilen.map(z => `<tr>${z.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  function block(b) {
    if (typeof b === "string") return `<p>${b}</p>`;
    if (b.tabelle) return tabelleHtml(b.tabelle);
    if (b.liste) { const t = b.nummer ? "ol" : "ul"; return `<${t} class="punkte">${b.liste.map(x => `<li>${x}</li>`).join("")}</${t}>`; }
    if (b.merke) return `<div class="merke"><div class="label">Merke</div><div>${b.merke}</div></div>`;
    if (b.satz) return satzHtml(b.satz.soll, b.satz.haben, b.satz.datum);
    if (b.bilanz) return bilanzHtml(b.bilanz);
    if (b.tkonten) return `<div class="tk-reihe">${b.tkonten.map(tkontoHtml).join("")}</div>`;
    if (b.fragen) return fragenHtml(b.fragen);
    return "";
  }
  /* Letztes Wort blau, mit Punkt am Ende (Stil aus den Mockups) */
  function akzent(text) {
    const t = String(text).trim(), i = t.lastIndexOf(" ");
    const letzt = i < 0 ? t : t.slice(i + 1), vorn = i < 0 ? "" : t.slice(0, i + 1);
    const punkt = /[A-Za-zÄÖÜäöüß0-9]$/.test(letzt) ? "." : "";
    return `${esc(vorn)}<span class="akzent">${esc(letzt)}${punkt}</span>`;
  }
  /* Geldbetrag im Fall-Text blau */
  const betragAkzent = text => esc(text).replace(/(€\s?[\d.]+,[-–]+)(?!.*€)/, '<span class="akzent">$1</span>');
  /* Fortschritt: bis 12 Schritte als Punkte, sonst als Balken */
  const fortschritt = (n, i) => n <= 12
    ? `<div class="dots" role="img" aria-label="Schritt ${i + 1} von ${n}">${Array.from({ length: n }, (_, j) => `<i class="${j < i ? "done" : j === i ? "jetzt" : ""}"></i>`).join("")}</div>`
    : `<div class="bar" role="img" aria-label="Schritt ${i + 1} von ${n}"><i style="width:${Math.round((i / n) * 100)}%"></i></div>`;
  const kopf = (text, zurueckAct = "schliessen") => `<header class="s-kopf"><button class="rund" data-act="${zurueckAct}" aria-label="Zurück">${zurueckAct === "schliessen" ? I.x : I.zurueck}</button><span class="mitte muted klein">${text}</span></header>`;
  const sKopf = (n, i) => `<header class="s-kopf"><button class="rund" data-act="schliessen" aria-label="Schliessen">${I.x}</button><span class="mitte">${fortschritt(n, i)}</span><span class="zaehler">${i + 1}/${n}</span></header>`;
  const melden = ctx => `<button class="link klein" data-act="melden" data-ctx="${esc(ctx)}">${I.kreis} Fehler melden</button>`;

  /* ---------- Home ---------- */
  function naechstes() {
    for (const [nr] of LEKTIONEN) {
      const L = INHALT[nr]; if (!L) continue;
      const ab = (S.lek[nr] || {}).ab || 0, n = L.abschnitte.length;
      if (ab < n) return { pill: `Heute dran · LE ${nr}`, titel: L.titel, meta: ab ? `Abschnitt ${ab + 1} von ${n} · noch etwa ${(n - ab) * 3} Minuten.` : `${n} kurze Abschnitte · etwa ${n * 3} Minuten.`, btn: ab ? "Weiterlernen" : "Lektion starten", act: "lektion", nr, punkte: [n, ab] };
      if (!(S.lek[nr] || {}).gef) { const g = L.faelle.filter(f => f.gefuehrt).length; return { pill: `LE ${nr} · Schritt für Schritt`, titel: "Die 4 Fragen, Fall für Fall", meta: `${g} geführte Fälle · etwa 10 Minuten.`, btn: "Los geht's", act: "gefuehrt", nr }; }
      const offen = L.faelle.filter(f => !((S.f[f.id] || {}).r > 0)).length;
      if (offen) return { pill: `LE ${nr} · Fälle üben`, titel: `Noch ${offen} ${offen === 1 ? "Fall" : "Fälle"} offen`, meta: `${L.faelle.length - offen} von ${L.faelle.length} richtig gelöst.`, btn: "Fälle üben", act: "uebenLE", nr };
    }
    const f = fehlerListe().length;
    if (f) return { pill: "Fehlerliste", titel: `${f} ${f === 1 ? "Fehler" : "Fehler"} ausbügeln`, meta: "Was du zuletzt falsch hattest, nochmal gezielt.", btn: "Fehler üben", act: "fehlerUeben" };
    const n = LEKTIONEN.find(([nr]) => !INHALT[nr]);
    return { pill: "Alles erledigt", titel: n ? `LE ${n[0]} kommt ${PLAN[n[0]] || "bald"}` : "Alle Lektionen geschafft", meta: "Bis dahin: Gegentest auf Papier und Kontenplan-Drill.", btn: "Kontenplan-Drill", act: "drillStart" };
  }
  function home() {
    const h = new Date().getHours();
    const gruss = h < 11 ? "Guten Morgen" : h < 17 ? "Hallo" : "Guten Abend";
    const nx = naechstes(), fehler = fehlerListe().length;
    return `
    <section class="held">
      <header class="kopf">${S.name ? `<span class="rund" aria-hidden="true">${esc(S.name.slice(0, 1).toUpperCase())}</span>` : `<span class="platz"></span>`}<button class="rund" data-act="einst" aria-label="Einstellungen">${I.gear}</button></header>
      <h1 class="gruss">${gruss}${S.name ? `,<br>${esc(S.name)}` : "."}</h1>
      <div class="luft"></div>
      <span class="pill-tag">${esc(nx.pill)}</span>
      <h2>${akzent(nx.titel)}</h2>
      <p class="meta">${esc(nx.meta)}</p>
      ${nx.punkte ? fortschritt(nx.punkte[0], nx.punkte[1]) : ""}
      <div class="stats">
        <div class="stat"><b>${tageBis(S.pruefung)}</b><span>Tage bis Prüfung</span></div>
        <div class="stat"><b>${streak()} T</b><span>Streak</span></div>
        <div class="stat"><b>${xpHeute()} XP</b><span>von ${S.zielXp} heute</span></div>
      </div>
      <button class="btn breit" data-act="${nx.act}" data-nr="${nx.nr || ""}">${esc(nx.btn)}</button>
    </section>
    ${fehler && nx.act !== "fehlerUeben" ? `<button class="karte zeile tap" data-act="fehlerUeben"><span><b>${fehler} ${fehler === 1 ? "offener Fehler" : "offene Fehler"}</b><br><span class="muted klein">Gezielt nochmal üben</span></span>${I.pfeil}</button>` : ""}
    ${S.hinweisWeg ? "" : `<section class="karte hinweis"><div class="zeile"><div class="label">Tipp</div><button class="link klein" data-act="hinweisWeg">Ausblenden</button></div>
      <p>Leg die App auf deinen Home-Bildschirm. Sonst kann das iPhone deinen Fortschritt nach 7 Tagen ohne Nutzung löschen.</p>
      <p class="muted klein">iPhone: in Safari öffnen → Teilen → „Zum Home-Bildschirm“. Android: Menü ⋮ → „App installieren“.</p></section>`}`;
  }

  /* ---------- Lernen ---------- */
  function lernenTab() {
    return `<h1 class="titel">Lernen</h1><p class="muted unter">Eine Lektion pro LE. Kurze Abschnitte, nach jedem eine Frage. Danach Fälle Schritt für Schritt.</p>
    <div class="liste">${LEKTIONEN.map(([nr, t]) => {
      const L = INHALT[nr], p = Math.round(leFortschritt(nr) * 100);
      return L
        ? `<button class="karte le tap" data-act="le" data-nr="${nr}"><span class="nr">${nr}</span><span class="le-text"><b>${esc(t)}</b><span class="balken"><i style="width:${p}%"></i></span></span><span class="muted klein">${p} %</span></button>`
        : `<div class="karte le aus"><span class="nr">${nr}</span><span class="le-text"><b>${esc(t)}</b><span class="muted klein">kommt ${PLAN[nr] || "bald"}</span></span>${I.lock}</div>`;
    }).join("")}</div>`;
  }
  function leSeite() {
    const nr = V.view.nr, L = INHALT[nr], n = L.abschnitte.length, ab = Math.min((S.lek[nr] || {}).ab || 0, n);
    const ok = L.faelle.filter(f => (S.f[f.id] || {}).r > 0).length, gef = L.faelle.filter(f => f.gefuehrt).length;
    const schritt = (i, t, sub, act, fertig) => `<button class="karte schritt tap" data-act="${act}" data-nr="${nr}"><span class="nr ${fertig ? "fertig" : ""}">${fertig ? I.check : i}</span><span><b>${t}</b><br><span class="muted klein">${sub}</span></span>${I.pfeil}</button>`;
    return `${kopf("Lernen", "zuTab")}
    <div class="label">LE ${nr}</div><h1 class="titel">${esc(L.titel)}</h1>
    <div class="liste">
      ${schritt(1, "Lektion", `${ab} / ${n} Abschnitte`, "lektion", ab >= n)}
      ${schritt(2, "Schritt für Schritt", `${gef} Fälle mit den 4 Fragen`, "gefuehrt", (S.lek[nr] || {}).gef)}
      ${schritt(3, "Fälle üben", `${ok} / ${L.faelle.length} richtig gelöst`, "uebenLE", ok === L.faelle.length)}
      ${schritt(4, "Kontenplan-Drill", "10 schnelle Fragen zu den Konten dieser LE", "drillLE", false)}
    </div>
    <section class="karte"><div class="label">Das musst du können</div><ul class="punkte haken">${L.kannst.map(k => `<li>${esc(k)}</li>`).join("")}</ul></section>
    <section class="karte hinweis"><div class="label">Gegentest auf Papier</div><p>${esc(L.gegentest)}</p></section>`;
  }

  /* Lektion */
  function lektionStart(nr) {
    const L = INHALT[nr], ab = (S.lek[nr] || {}).ab || 0;
    sitzungStart();
    go({ typ: "lektion", nr, i: ab < L.abschnitte.length ? ab : 0, a: null, falsch: [] });
  }
  function lektionView() {
    const v = V.view, L = INHALT[v.nr], A = L.abschnitte[v.i], n = L.abschnitte.length, c = A.check;
    const richtig = v.a === c.richtig;
    return `${sKopf(n, v.i)}
    <article class="lektion"><span class="pill-tag" style="margin-top: 22px;">LE ${v.nr}</span><h1>${akzent(A.titel)}</h1>${A.inhalt.map(block).join("")}</article>
    <section class="karte frage"><p class="frage-text">${c.frage}</p>
      <div class="optionen">${(v.order = v.order || shuffle(c.optionen.map((_, j) => j))).map(j => {
        const o = c.optionen[j];
        const cls = (richtig && j === c.richtig ? "ok" : v.falsch.includes(j) ? "bad" : "") + (j === v.letzte ? " neu" : "");
        return `<button class="opt ${cls}" data-act="antwort" data-j="${j}" ${richtig ? "disabled" : ""}>${o}</button>`;
      }).join("")}</div>
      ${richtig ? `<div class="fb ok"><b>Richtig.</b> ${c.erklaerung}</div>` : v.falsch.length ? `<div class="fb bad"><b>Nicht ganz.</b> Lies den Abschnitt nochmal und versuch's erneut.</div>` : ""}
    </section>
    <div class="aktionen">${richtig ? `<button class="btn breit" data-act="weiter">${v.i + 1 < n ? "Weiter" : "Lektion abschliessen"}</button>` : ""}
      ${v.i > 0 ? `<button class="link" data-act="zurueckAbschnitt">← Vorheriger Abschnitt</button>` : ""}
      ${melden(`LE ${v.nr} · Abschnitt ${v.i + 1}`)}</div>`;
  }

  /* Schritt für Schritt (4 Fragen) */
  function gefStart(nr) {
    const q = INHALT[nr].faelle.filter(f => f.gefuehrt).map(f => f.id);
    V.view = { typ: "gefuehrt", nr, q, k: 0, richtig: 0 };
    sitzungStart(); gefFall(); window.scrollTo(0, 0);
  }
  function gefFall() {
    const v = V.view, f = FALL[v.q[v.k]], richtig = kontenVon(f);
    const pool = INHALT[v.nr].konten.filter(k => !richtig.includes(k));
    v.opt = shuffle(richtig.concat(shuffle(pool).slice(0, 4)));
    v.stufe = "konten"; v.wahl = []; v.sauber = true; v.a = {}; v.fx = null;
    animiere = "vor"; render();
  }
  function gefuehrtView() {
    const v = V.view, f = FALL[v.q[v.k]], L = INHALT[v.nr];
    let body = "";
    if (v.stufe === "konten") {
      const soll = kontenVon(f);
      body = `<section class="karte"><div class="label">Frage 1 von 4</div><h3>Welche Konten sind beteiligt?</h3>
        <p class="muted klein">Tipp alle an, die sich durch den Fall verändern.</p>
        <div class="chips">${v.opt.map(k => {
          const an = v.wahl.includes(k), cls = v.fx && an ? (soll.includes(k) ? "ok" : "bad") : "";
          return `<button class="chip ${an ? "an" : ""} ${cls}" data-act="gefWahl" data-k="${esc(k)}">${kontoHtml(k)}</button>`;
        }).join("")}</div>
        ${v.fx ? `<div class="fb bad">${v.fx}</div>` : ""}
        <button class="btn breit" data-act="gefKonten" ${v.wahl.length ? "" : "disabled"}>Prüfen</button></section>`;
    } else {
      const zeilen = f.analyse.map(([k, art, r, s]) => {
        const a = v.a[k] || {}, x = (v.fx || {})[k] || {};
        const seg = (feld, opts, label) => `<div class="seg-zeile"><span class="muted klein">${label}</span><div class="seg">${opts.map(([val, txt]) =>
          `<button class="${a[feld] === val ? "an" : ""} ${a[feld] === val && x[feld] === false ? "bad" : ""} ${a[feld] === val && x[feld] === true ? "ok" : ""}" data-act="gefSet" data-k="${esc(k)}" data-f="${feld}" data-v="${val}" ${v.stufe === "fertig" ? "disabled" : ""}>${txt}</button>`).join("")}</div></div>`;
        const zeigeR = !OHNE_R.includes(a.art);
        return `<div class="analyse"><div class="an-kopf">${kontoHtml(k)}</div>
          ${seg("art", L.arten.map(t => [t, ARTKURZ[t]]), "Kontoart")}
          ${zeigeR ? seg("r", [["+", "+ Zugang"], ["–", "– Abgang"]], "Zugang oder Abgang") : ""}
          ${seg("s", [["S", "Soll"], ["H", "Haben"]], "Seite")}</div>`;
      }).join("");
      body = `<section class="karte"><div class="label">Fragen 2 bis 4</div><h3>Kontoart, Zugang oder Abgang, Seite</h3>${zeilen}
        ${v.fx && v.stufe !== "fertig" ? `<div class="fb bad">Rot markiert ist noch falsch. Korrigier es und prüf nochmal.</div>` : ""}
        ${v.stufe !== "fertig" ? `<button class="btn breit" data-act="gefAnalyse">Prüfen</button>` : ""}</section>`;
      if (v.stufe === "fertig") body += `<section class="karte"><div class="fb ${v.sauber ? "ok" : "neutral"}"><b>${v.sauber ? "Auf Anhieb richtig." : "Jetzt stimmt's."}</b> Daraus wird der Buchungssatz:</div>${satzVonFall(f)}
        <div class="merke"><div class="label">Merke</div><div>${esc(f.merke)}</div></div>
        <p class="muted klein"><b>Typischer Fehler:</b> ${esc(f.fehler)}</p>${glossarHtml(f)}
        <button class="btn breit" data-act="gefWeiter">${v.k + 1 < v.q.length ? "Nächster Fall" : "Fertig"}</button>${melden(`LE ${v.nr} · Fall ${f.id}`)}</section>`;
    }
    return `${sKopf(v.q.length, v.k)}
      <section class="fall"><span class="pill-tag" style="margin-top: 22px;">LE ${f.le} · ${esc(f.datum)} · Schritt für Schritt</span><p class="fall-text">${betragAkzent(f.text)}</p></section>${body}`;
  }

  /* Fälle üben (freie Eingabe) */
  function uebenStart(ids, titelText, zurueck) {
    if (!ids.length) { toast("Keine Fälle ausgewählt."); return; }
    V.view = { typ: "ueben", q: shuffle(ids), k: 0, richtig: 0, titel: titelText, zurueck };
    sitzungStart(); neueEingabe(); window.scrollTo(0, 0);
  }
  function neueEingabe() { const v = V.view; v.ein = { soll: [{ konto: "", betrag: "" }], haben: [{ konto: "", betrag: "" }] }; v.geprueft = false; v.ok = null; animiere = "vor"; render(); }
  function istRichtig(f, ein) {
    return ["soll", "haben"].every(s => {
      const e = ein[s].filter(z => z.konto || z.betrag), l = f[s];
      if (e.length !== l.length) return false;
      const rest = l.slice();
      return e.every(z => { const i = rest.findIndex(r => r.konto === z.konto && r.betrag === parseBetrag(z.betrag)); if (i < 0) return false; rest.splice(i, 1); return true; });
    });
  }
  function uebenView() {
    const v = V.view, f = FALL[v.q[v.k]];
    const zeilen = s => v.ein[s].map((z, i) => `<div class="ez">${s === "haben" ? '<span class="anw">an</span>' : ""}
      <button class="konto-btn ${z.konto ? "" : "leer"}" data-act="pick" data-s="${s}" data-i="${i}" ${v.geprueft ? "disabled" : ""}>${z.konto ? kontoHtml(z.konto) : "Konto wählen"}</button>
      <input class="betrag" inputmode="decimal" autocomplete="off" placeholder="Betrag" aria-label="Betrag" value="${esc(z.betrag)}" data-s="${s}" data-i="${i}" ${v.geprueft ? "disabled" : ""}>
      ${v.ein[s].length > 1 && !v.geprueft ? `<button class="x" data-act="zDel" data-s="${s}" data-i="${i}" aria-label="Zeile löschen">${I.x}</button>` : ""}</div>`).join("")
      + (v.geprueft ? "" : `<button class="link klein" data-act="zAdd" data-s="${s}">+ Zeile ${s === "soll" ? "Soll" : "Haben"}</button>`);
    let fb = "";
    if (v.geprueft) {
      const summe = s => v.ein[s].reduce((a, z) => a + (parseBetrag(z.betrag) || 0), 0);
      const ungleich = summe("soll") !== summe("haben");
      fb = `<section class="karte"><div class="fb ${v.ok ? "ok" : "bad"}"><b>${v.ok ? "Richtig." : "Nicht ganz."}</b> ${v.ok ? "" : ungleich ? "Soll und Haben sind nicht gleich gross. " : ""}${v.ok ? "" : "So wäre es richtig:"}</div>
        ${v.ok ? "" : satzVonFall(f)}
        <div class="label">Die 4 Fragen</div>${fragenHtml(f.analyse)}
        <div class="merke"><div class="label">Merke</div><div>${esc(f.merke)}</div></div>
        <p class="muted klein"><b>Typischer Fehler:</b> ${esc(f.fehler)}</p>${glossarHtml(f)}
        <button class="btn breit" data-act="uWeiter">${v.k + 1 < v.q.length ? "Nächster Fall" : "Auswertung"}</button>${melden(`LE ${f.le} · Fall ${f.id}`)}</section>`;
    }
    return `${sKopf(v.q.length, v.k)}
      <section class="fall"><span class="pill-tag" style="margin-top: 22px;">LE ${f.le} · ${esc(f.datum)}</span><p class="fall-text">${betragAkzent(f.text)}</p></section>
      <section class="karte"><div class="zeile"><div class="label">Buchungssatz</div><span class="muted klein">Zeilen bestimmst du selbst</span></div>
        <div class="seite-label">Soll</div>${zeilen("soll")}<div class="seite-label">Haben</div>${zeilen("haben")}
        ${v.geprueft ? "" : `<button class="btn breit" data-act="uPruefen">Prüfen</button>`}</section>${fb}`;
  }

  /* Kontenplan-Drill */
  function drillStart(nrs) {
    const konten = [...new Set(nrs.flatMap(n => INHALT[n].konten))];
    const arten = [...new Set(nrs.flatMap(n => INHALT[n].arten))];
    const ks = shuffle(konten), fragen = [];
    for (let i = 0; i < 10; i++) {
      const k = ks[i % ks.length];
      if (i % 2 === 0 || !ART[k]) {
        const opts = shuffle([NAME[k]].concat(shuffle(konten.filter(x => x !== k)).slice(0, 3).map(x => NAME[x])));
        fragen.push({ frage: `Wofür steht <b>${esc(k)}</b>?`, optionen: opts, richtig: opts.indexOf(NAME[k]) });
      } else {
        fragen.push({ frage: `<b>${esc(NAME[k])}</b> (${esc(k)}) ist ein …`, optionen: arten.map(a => ARTLABEL[a]), richtig: arten.indexOf(ART[k]) });
      }
    }
    sitzungStart();
    go({ typ: "drill", fragen, k: 0, a: null, richtig: 0, nrs });
  }
  function drillView() {
    const v = V.view, q = v.fragen[v.k];
    return `${sKopf(v.fragen.length, v.k)}
      <span class="pill-tag" style="margin-top: 22px;">Kontenplan-Drill</span>
      <section class="karte frage"><p class="frage-text gross-text">${q.frage}</p>
      <div class="optionen">${q.optionen.map((o, j) => {
        const cls = v.a == null ? "" : (j === q.richtig ? "ok" : j === v.a ? "bad" : "") + (j === v.a ? " neu" : "");
        return `<button class="opt ${cls}" data-act="dAntwort" data-j="${j}" ${v.a != null ? "disabled" : ""}>${esc(o)}</button>`;
      }).join("")}</div>
      ${v.a != null ? `<button class="btn breit" data-act="dWeiter">${v.k + 1 < v.fragen.length ? "Weiter" : "Auswertung"}</button>` : ""}</section>`;
  }

  /* Ende */
  function endeView() {
    const v = V.view, xp = Math.max(0, xpHeute() - xp0);
    return `<section class="ende">
      <div class="ende-kopf"><div class="ende-icon">${I.check}</div></div>
      ${v.pill ? `<span class="pill-tag">${esc(v.pill)}</span>` : ""}
      <h1>${akzent(v.titel)}</h1>
      ${v.text ? `<p class="meta">${esc(v.text)}</p>` : ""}
      <div class="stats">
        ${v.gesamt ? `<div class="stat"><b>${v.richtig}/${v.gesamt}</b><span>auf Anhieb</span></div>` : (v.nr && v.typ === "ende" && !v.gesamt ? `<div class="stat"><b>${INHALT[v.nr].abschnitte.length}</b><span>Abschnitte</span></div>` : `<div class="stat"><b>${xpHeute()}</b><span>XP heute</span></div>`)}
        <div class="stat"><b class="akzent">+${xp}</b><span>XP</span></div>
        <div class="stat"><b>${streak()} T</b><span>Streak</span></div>
      </div>
      <div class="aktionen">${(v.buttons || []).map(([t, act, nr], i) => `<button class="${i ? "btn-text" : "btn"} breit" data-act="${act}" data-nr="${nr || ""}">${esc(t)}</button>`).join("")}</div>
    </section>`;
  }

    <div class="chips">${LEKTIONEN.map(([n]) => INHALT[n]
      ? `<button class="chip ${S.ueAuswahl.includes(n) ? "an" : ""}" data-act="ueSel" data-nr="${n}">LE ${n}</button>`

      <button class="karte modus tap" data-act="uebenAuswahl" ${anzahl ? "" : "disabled"}><span class="m-icon">${I.stift}</span><span><b>Buchungssätze</b><br><span class="muted klein">${anzahl} Fälle · ohne Zeilen-Vorgabe, wie in der Prüfung</span></span>${I.pfeil}</button>
      <button class="karte modus tap" data-act="drillStart" ${sel.length ? "" : "disabled"}><span class="m-icon">${I.blitz}</span><span><b>Kontenplan-Drill</b><br><span class="muted klein">10 Fragen: Abkürzungen und Kontoarten</span></span>${I.pfeil}</button>

  /* ---------- Einstellungen ---------- */
  function einstView() {
    const seg = (key, opts) => `<div class="seg">${opts.map(([v, t]) => `<button class="${String(S[key]) === String(v) ? "an" : ""}" data-act="setz" data-key="${key}" data-v="${v}">${t}</button>`).join("")}</div>`;

      <div class="feld"><span>Tagesziel</span>${seg("zielXp", [[50, "50 XP"], [100, "100 XP"], [150, "150 XP"]])}<span class="muted klein" style="font-weight: 400;">Richtiger Fall +10 XP · Fehlversuch +2 · neuer Abschnitt +5 · Drill-Treffer +2</span></div>
      <label class="feld"><span>Dein Name</span><input class="eingabe" data-key="name" value="${esc(S.name)}" placeholder="für die Begrüssung" autocomplete="given-name"></label>

      ${S.meld.length ? `<ul class="meldungen">${S.meld.map(m => `<li><span class="muted klein">${esc(m.d)}</span> ${esc(m.t)}</li>`).join("")}</ul>
        ${v.leeren ? `<p>Alle Meldungen löschen?</p><div class="aktionen reihe"><button class="btn-zwei" data-act="meldLeerenJa">Ja, löschen</button><button class="link" data-act="meldLeerenNein">Abbrechen</button></div>` : `<button class="link klein" data-act="meldLeeren">Liste leeren</button>`}`
        : `<p class="muted klein">Wenn dir eine Lösung komisch vorkommt: „Fehler melden“ tippen. Die Meldung landet hier.</p>`}</section>
    <section class="karte"><div class="label">App auf den Home-Bildschirm</div>
      <p class="klein">iPhone: in Safari öffnen → Teilen → „Zum Home-Bildschirm“. Android: Menü ⋮ → „App installieren“. Dann bleibt dein Fortschritt sicher gespeichert.</p></section>
    <section class="karte"><div class="label">Fortschritt</div>
      ${v.reset ? `<p>Wirklich alles zurücksetzen? Lektionen, Fälle und Fehlerliste werden gelöscht.</p><div class="aktionen reihe"><button class="btn-zwei rot" data-act="resetJa">Ja, zurücksetzen</button><button class="link" data-act="resetNein">Abbrechen</button></div>`
        : `<button class="btn-zwei" data-act="reset">Fortschritt zurücksetzen</button>`}</section>
    <section class="karte"><div class="label">Hinweis</div>
      <p class="klein muted">Lösungen ohne Gewähr. Kein offizielles Angebot der Universität Liechtenstein. Dein Fortschritt bleibt nur auf diesem Gerät, es wird nichts an einen Server gesendet.</p>
      <p class="klein muted">Version 0.4 · 14.11.2026</p></section>`;

  /* ---------- Sheets ---------- */
  function sheetAuf(html) { sheet.innerHTML = `<div class="sheet-bg" data-act="sheetZu"></div><div class="sheet-box" role="dialog" aria-modal="true">${html}</div>`; sheet.hidden = false; }
  function sheetZu() { sheet.hidden = true; sheet.innerHTML = ""; }
  let pickZiel = null;
  function pickerAuf(s, i) {
    pickZiel = { s, i };
    sheetAuf(`<div class="sheet-kopf"><input id="suche" class="eingabe" placeholder="Konto suchen: Kürzel oder Name" autocomplete="off" aria-label="Konto suchen"><button class="link" data-act="sheetZu">Fertig</button></div><div id="kliste" class="kliste"></div>`);
    kliste("");
    const su = $("#suche"); su.addEventListener("input", () => kliste(su.value));
  }
  function kliste(q) {
    const f = FALL[V.view.q[V.view.k]], n = norm(q.trim());
    const item = ([k, v]) => `<button class="kitem" data-act="pickK" data-k="${esc(k)}"><span class="abbr">${esc(k)}</span><span>${esc(v)}</span></button>`;
    let html;
    if (!n) {
      const haeufig = (INHALT[f.le].konten || []).map(k => [k, NAME[k]]);
      html = `<div class="label">Häufig in LE ${f.le}</div>${haeufig.map(item).join("")}<div class="label">Ganzer Kontenplan</div>${KONTEN.map(item).join("")}`;
    } else {
      const t = KONTEN.filter(([k, v]) => norm(k).includes(n) || norm(v).includes(n));
      html = t.length ? t.map(item).join("") : `<p class="muted klein">Kein Konto gefunden.</p>`;
    }
    $("#kliste").innerHTML = html;
  }
  function meldenAuf(ctx) {
    sheetAuf(`<h3>Fehler melden</h3><p class="muted klein">Was stimmt nicht? Die Meldung wird gespeichert und kopiert. Schick sie an Leon.</p>
      <textarea id="meldText" class="eingabe" rows="5">[${esc(ctx)}] </textarea>
      <div class="aktionen"><button class="btn breit" data-act="meldSpeichern">Speichern und kopieren</button><button class="link" data-act="sheetZu">Abbrechen</button></div>`);
    const t = $("#meldText"); t.focus(); t.setSelectionRange(t.value.length, t.value.length);
  }
  function kopieren(text, fallbackEl) {
    try {
      navigator.clipboard.writeText(text).then(() => toast("Kopiert."), () => { if (fallbackEl) fallbackEl.select(); toast("Gespeichert. Kopieren ging nicht, Text ist markiert."); });
    } catch (e) { if (fallbackEl) fallbackEl.select(); toast("Gespeichert."); }
  }

  /* ---------- Aktionen ---------- */
  const A = {
    tab: d => tab(d.t),
    einst: () => go({ typ: "einst" }),
    schliessen: () => {
      const v = V.view;
      if (v && v.zurueck) return go(v.zurueck);
      if (v && v.nr && INHALT[v.nr] && v.typ !== "le") return go({ typ: "le", nr: v.nr });
      V.view = null; animiere = "tab"; render(); window.scrollTo(0, 0);
    },
    zuTab: () => { V.view = null; animiere = "tab"; render(); window.scrollTo(0, 0); },
    le: d => go({ typ: "le", nr: +d.nr }),
    lektion: d => lektionStart(+d.nr),
    gefuehrt: d => gefStart(+d.nr),
    uebenLE: d => uebenStart(INHALT[+d.nr].faelle.map(f => f.id), `LE ${d.nr}`, { typ: "le", nr: +d.nr }),
    uebenAuswahl: () => uebenStart(S.ueAuswahl.filter(n => INHALT[n]).flatMap(n => INHALT[n].faelle.map(f => f.id)), "Buchungssätze"),
    fehlerUeben: () => uebenStart(fehlerListe(), "Fehler"),
    drillStart: () => { const nrs = S.ueAuswahl.filter(n => INHALT[n]); drillStart(nrs.length ? nrs : Object.keys(INHALT).map(Number)); },
    drillLE: d => { drillStart([+d.nr]); V.view.zurueck = { typ: "le", nr: +d.nr }; },
    hinweisWeg: () => { S.hinweisWeg = true; speichern(); render(); },
    ueSel: d => { const n = +d.nr, a = S.ueAuswahl; S.ueAuswahl = a.includes(n) ? a.filter(x => x !== n) : a.concat(n).sort((x, y) => x - y); speichern(); render(); },

    antwort: d => { const v = V.view, j = +d.j, c = INHALT[v.nr].abschnitte[v.i].check; v.letzte = j; if (j === c.richtig) v.a = j; else if (!v.falsch.includes(j)) v.falsch.push(j); render(); },
    weiter: () => {
      const v = V.view, L = INHALT[v.nr], l = lek(v.nr);
      const neu = v.i + 1 > (l.ab || 0);
      l.ab = Math.max(l.ab || 0, v.i + 1);
      if (neu) xpPlus(5); else speichern();
      if (v.i + 1 < L.abschnitte.length) go({ typ: "lektion", nr: v.nr, i: v.i + 1, a: null, falsch: [] });
      else go({ typ: "ende", nr: v.nr, pill: `LE ${v.nr} · Lektion`, titel: `Lektion ${v.nr} geschafft`, text: "Jetzt die Fälle Schritt für Schritt: Du beantwortest die 4 Fragen einzeln, die App baut daraus den Buchungssatz.", buttons: [["Schritt für Schritt", "gefuehrt", v.nr], ["Zur Übersicht", "le", v.nr]] });
    },
    zurueckAbschnitt: () => { const v = V.view; go({ typ: "lektion", nr: v.nr, i: v.i - 1, a: null, falsch: [] }); },

    gefWahl: d => { const v = V.view; v.wahl = v.wahl.includes(d.k) ? v.wahl.filter(x => x !== d.k) : v.wahl.concat(d.k); v.fx = null; render(); },
    gefKonten: () => {
      const v = V.view, soll = kontenVon(FALL[v.q[v.k]]);
      const falsch = v.wahl.filter(k => !soll.includes(k)), fehlt = soll.filter(k => !v.wahl.includes(k));
      if (!falsch.length && !fehlt.length) { v.stufe = "analyse"; v.fx = null; render(); return; }
      v.sauber = false;
      v.fx = falsch.length ? `${falsch.length === 1 ? "Ein Konto gehört" : falsch.length + " Konten gehören"} nicht dazu (rot).` + (fehlt.length ? ` Und es ${fehlt.length === 1 ? "fehlt noch eins" : "fehlen noch " + fehlt.length}.` : "")
        : `Es ${fehlt.length === 1 ? "fehlt noch ein Konto" : "fehlen noch " + fehlt.length + " Konten"}.`;
      render();
    },
    gefSet: d => { const v = V.view; v.a[d.k] = Object.assign({}, v.a[d.k], { [d.f]: d.v }); if (v.fx && v.fx[d.k]) delete v.fx[d.k][d.f]; render(); },
    gefAnalyse: () => {
      const v = V.view, f = FALL[v.q[v.k]];
      const unvollstaendig = f.analyse.some(([k]) => { const a = v.a[k] || {}; return !a.art || !a.s || (!OHNE_R.includes(a.art) && !a.r); });
      if (unvollstaendig) { toast("Fülle zuerst alle Felder aus."); return; }
      let alles = true; v.fx = {};
      f.analyse.forEach(([k, art, r, s]) => {
        const a = v.a[k] || {}, x = {};
        const mitR = !OHNE_R.includes(art);
        x.art = a.art === art; x.s = a.s === s; if (mitR) x.r = a.r === r;
        if (Object.values(x).includes(false) || !a.art || !a.s || (mitR && !a.r)) alles = false;
        v.fx[k] = x;
      });
      if (alles) { v.stufe = "fertig"; werten(f.id, v.sauber); if (v.sauber) v.richtig++; } else v.sauber = false;
      render();
    },
    gefWeiter: () => {
      const v = V.view;
      if (v.k + 1 < v.q.length) { v.k++; gefFall(); window.scrollTo(0, 0); return; }
      lek(v.nr).gef = true; speichern();
      go({ typ: "ende", nr: v.nr, pill: `LE ${v.nr} · Schritt für Schritt`, titel: "Die 4 Fragen sitzen", richtig: v.richtig, gesamt: v.q.length, text: "Jetzt alle Fälle ohne Hilfe, mit freier Eingabe wie in der Prüfung.", buttons: [["Alle Fälle üben", "uebenLE", v.nr], ["Zur Übersicht", "le", v.nr]] });
    },

    pick: d => pickerAuf(d.s, +d.i),
    pickK: d => { const v = V.view; v.ein[pickZiel.s][pickZiel.i].konto = d.k; sheetZu(); render(); },
    zAdd: d => { V.view.ein[d.s].push({ konto: "", betrag: "" }); render(); },
    zDel: d => { const z = V.view.ein[d.s]; if (z.length > 1) z.splice(+d.i, 1); render(); },
    uPruefen: () => {
      const v = V.view, f = FALL[v.q[v.k]];
      if (![...v.ein.soll, ...v.ein.haben].some(z => z.konto)) { toast("Wähl zuerst mindestens ein Konto."); return; }
      v.ok = istRichtig(f, v.ein); v.geprueft = true; if (v.ok) v.richtig++; werten(f.id, v.ok); render();
    },
    uWeiter: () => {
      const v = V.view;
      if (v.k + 1 < v.q.length) { v.k++; neueEingabe(); window.scrollTo(0, 0); return; }
      const f = fehlerListe().length;
      go({ typ: "ende", pill: v.titel, titel: v.richtig === v.q.length ? "Alles richtig" : "Runde geschafft", richtig: v.richtig, gesamt: v.q.length, zurueck: v.zurueck,
        buttons: [f ? ["Fehler üben (" + f + ")", "fehlerUeben"] : ["Nochmal mischen", "uebenAuswahl"], ["Fertig", "schliessen"]] });
    },

    dAntwort: d => { const v = V.view; v.a = +d.j; if (v.a === v.fragen[v.k].richtig) { v.richtig++; xpPlus(2); } render(); },
    dWeiter: () => {
      const v = V.view;
      if (v.k + 1 < v.fragen.length) { v.k++; v.a = null; animiere = "vor"; render(); window.scrollTo(0, 0); return; }
      go({ typ: "ende", pill: "Kontenplan-Drill", titel: "Drill geschafft", richtig: v.richtig, gesamt: v.fragen.length, zurueck: v.zurueck, buttons: [["Nochmal", "drillStart"], ["Fertig", "schliessen"]] });
    },

    melden: d => meldenAuf(d.ctx),
    meldSpeichern: () => {
      const t = $("#meldText"), text = t.value.trim(); if (!text) return;
      S.meld.push({ d: new Date().toLocaleDateString("de-DE"), t: text }); speichern();
      kopieren(text, t); sheetZu();
    },
    meldKopieren: () => kopieren(S.meld.map(m => `${m.d} ${m.t}`).join("\n")),
    meldLeeren: () => { V.view.leeren = true; render(); },
    meldLeerenNein: () => { V.view.leeren = false; render(); },
    meldLeerenJa: () => { S.meld = []; speichern(); V.view.leeren = false; render(); },
    sheetZu: () => sheetZu(),
    setz: d => { const n = Number(d.v); S[d.key] = d.key === "zielXp" ? n : d.v; speichern(); if (d.key === "theme") themeAnwenden(); render(); },
    reset: () => { V.view.reset = true; render(); },
    resetNein: () => { V.view.reset = false; render(); },
    resetJa: () => { const behalten = { theme: S.theme, name: S.name, anzeige: S.anzeige, pruefung: S.pruefung, zielXp: S.zielXp }; S = Object.assign(kopie(START), behalten); speichern(); V.view.reset = false; toast("Fortschritt zurückgesetzt."); render(); }
  };

  document.addEventListener("click", e => {
    const t = e.target.closest("[data-act]"); if (!t || t.disabled) return;
